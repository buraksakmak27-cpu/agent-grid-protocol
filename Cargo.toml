[package]
name = "token_borsasi"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ordered-float = "3.0"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
solana-client = "1.16"
solana-sdk = "1.16"
solana-transaction-status = "1.16"
base64 = "0.21"
bincode = "1.3"
